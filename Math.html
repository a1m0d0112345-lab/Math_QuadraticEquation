<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<script src="https://cdn.tailwindcss.com"></script>
<script>
MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  :root {
    --bg: #f8fafc;
    --bg-card: #ffffff;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --accent: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --sidebar-bg: #ffffff;
  }
  .dark {
    --bg: #0f172a;
    --bg-card: #1e293b;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --primary: #818cf8;
    --primary-hover: #6366f1;
    --accent: #34d399;
    --danger: #f87171;
    --warning: #fbbf24;
    --sidebar-bg: #1e293b;
  }
  * { font-family: 'Vazirmatn', sans-serif; }
  body { background: var(--bg); color: var(--text); transition: background .3s, color .3s; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; }
  .btn-primary { background: var(--primary); color: white; transition: all .2s; }
  .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--bg-card); }
  .muted { color: var(--text-muted); }
  .border-c { border-color: var(--border); }
  .bg-card { background: var(--bg-card); }
  .sidebar { background: var(--sidebar-bg); border-left: 1px solid var(--border); }
  .nav-item { color: var(--text-muted); transition: all .2s; }
  .nav-item:hover { color: var(--primary); background: var(--bg); }
  .nav-item.active { color: var(--primary); background: var(--bg); font-weight: 600; }
  .nav-item.active::before { content: ''; position: absolute; right: 0; top: 8px; bottom: 8px; width: 3px; background: var(--primary); border-radius: 2px; }
  .progress-bar { background: var(--border); border-radius: 999px; overflow: hidden; }
  .progress-fill { background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .5s; }
  .slider { -webkit-appearance: none; width: 100%; height: 6px; background: var(--border); border-radius: 3px; outline: none; }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--primary); border-radius: 50%; cursor: pointer; }
  .slider::-moz-range-thumb { width: 20px; height: 20px; background: var(--primary); border-radius: 50%; cursor: pointer; border: none; }
  .chapter-card { cursor: pointer; transition: all .2s; }
  .chapter-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,.1); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .fade-in { animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .tab-active { color: var(--primary); border-bottom: 2px solid var(--primary); }
  input, select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; outline: none; transition: border .2s; }
  input:focus, select:focus { border-color: var(--primary); }
  .option-btn { text-align: right; padding: 14px 18px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all .2s; background: var(--bg-card); }
  .option-btn:hover { border-color: var(--primary); }
  .option-btn.selected { border-color: var(--primary); background: rgba(99,102,241,.08); }
  .option-btn.correct { border-color: var(--accent); background: rgba(16,185,129,.1); }
  .option-btn.wrong { border-color: var(--danger); background: rgba(239,68,68,.1); }
  .flashcard { perspective: 1000px; cursor: pointer; min-height: 240px; }
  .flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform .6s; transform-style: preserve-3d; }
  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
  .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .flashcard-front { background: linear-gradient(135deg, var(--primary), #8b5cf6); color: white; }
  .flashcard-back { background: var(--bg-card); border: 2px solid var(--accent); transform: rotateY(180deg); color: var(--text); }
  .tooltip { position: absolute; background: var(--bg-card); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 12px; pointer-events: none; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  mjx-container { direction: ltr !important; display: inline-block !important; }
  .step-box { border-right: 3px solid var(--primary); padding-right: 16px; margin-bottom: 16px; }
</style>
</head>
<body>

<div id="app" class="min-h-screen flex">
  <!-- Sidebar -->

            <svg id="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

          <button class="btn-primary px-4 py-2 rounded-xl text-sm font-medium hidden sm:block" onclick="navigate('exam')">شروع آزمون</button>

    </header>

    <!-- Content -->
    <main id="content" class="flex-1 p-4 md:p-8 fade-in"></main>
  </div>
</div>

<script>
/* =========================================================
   STATE & DATA
   ========================================================= */
const state = {
  currentPage: 'dashboard',
  currentChapter: 0,
  currentQuiz: 0,
  quizAnswers: {},
  examState: null,
  darkMode: localStorage.getItem('darkMode') === 'true',
  progress: JSON.parse(localStorage.getItem('progress') || '{}'),
  stats: JSON.parse(localStorage.getItem('stats') || '{"solved":0,"correct":0,"wrong":0,"lastActivity":null,"weakTopics":[]}'),
  completedChapters: JSON.parse(localStorage.getItem('completedChapters') || '[]'),
  chapterScores: JSON.parse(localStorage.getItem('chapterScores') || '{}')
};

function saveState() {
  localStorage.setItem('progress', JSON.stringify(state.progress));
  localStorage.setItem('stats', JSON.stringify(state.stats));
  localStorage.setItem('completedChapters', JSON.stringify(state.completedChapters));
  localStorage.setItem('chapterScores', JSON.stringify(state.chapterScores));
  localStorage.setItem('darkMode', state.darkMode);
}

/* =========================================================
   CHAPTERS DATA
   ========================================================= */
const chapters = [
  {
    id: 1, title: 'مفهوم تابع درجه دوم', icon: '📘',

      <div class="card p-6 mb-4">
        <h3 class="font-bold text-lg mb-3">📌 تعریف</h3>

        <div class="text-center text-xl py-4 bg-[var(--bg)] rounded-xl">$$f(x) = ax^2 + bx + c \\quad , \\quad a \\neq 0$$</div>
        <p class="mt-3 muted text-sm">که در آن $a$، $b$ و $c$ اعداد حقیقی و $a \\neq 0$ است.</p>

        <h3 class="font-bold text-lg mb-3">🎯 نقش ضرایب</h3>
        <ul class="space-y-2">
          <li><b>ضریب $a$:</b> جهت بازشدگی سهمی و عرض آن را تعیین می‌کند.</li>
          <li><b>ضریب $b$:</b> همراه با $a$، محل رأس سهمی را مشخص می‌کند.</li>
          <li><b>ضریب $c$:</b> محل تقاطع نمودار با محور $y$ها است ($f(0) = c$).</li>
        </ul>
      </div>

      <div class="card p-6 mb-4">
        <h3 class="font-bold text-lg mb-3">📐 دامنه و برد</h3>

function renderNav() {
  const menu = document.getElementById('nav-menu');
  menu.innerHTML = navItems.map(n => `
    <a href="#" onclick="navigate('${n.id}'); return false;" class="nav-item ${state.currentPage === n.id ? 'active' : ''} relative flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm">

    </a>
  `).join('');

function navigate(page, data) {
  state.currentPage = page;
  if (data) state.currentChapter = data;
  renderNav();
  renderPage();
  document.getElementById('sidebar').classList.add('translate-x-full');
  document.getElementById('sidebar').classList.remove('translate-x-0');
  window.scrollTo(0, 0);
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}

/* =========================================================
   PAGES
   ========================================================= */
function renderPage() {
  const content = document.getElementById('content');
  content.classList.remove('fade-in');
  void content.offsetWidth;
  content.classList.add('fade-in');
  
  switch(state.currentPage) {
    case 'dashboard': renderDashboard(); break;
    case 'learn': renderLearn(); break;
    case 'chapter': renderChapter(); break;
    case 'graph': renderGraph(); break;
    case 'analyzer': renderAnalyzer(); break;
    case 'solver': renderSolver(); break;
    case 'quiz': renderQuiz(); break;
    case 'exam': renderExam(); break;
    case 'formulas': renderFormulas(); break;
    case 'flashcards': renderFlashcards(); break;
    case 'mistakes': renderMistakes(); break;
    case 'progress': renderProgress(); break;
    default: renderDashboard();
  }
}

let graphState = { a: 1, b: 0, c: 0, zoom: 1, offsetX: 0, offsetY: 0, dragging: false, lastX: 0, lastY: 0 };

function initMainGraph() {
  const canvas = document.getElementById('main-graph');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  const updateVals = () => {
    graphState.a = parseFloat(document.getElementById('mg-a').value);
    graphState.b = parseFloat(document.getElementById('mg-b').value);
    graphState.c = parseFloat(document.getElementById('mg-c').value);
    document.getElementById('mg-a-val').textContent = graphState.a;
    document.getElementById('mg-b-val').textContent = graphState.b;
    document.getElementById('mg-c-val').textContent = graphState.c;
    drawMainGraph();
    updateGraphInfo();
  };
  
  ['mg-a', 'mg-b', 'mg-c'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateVals);
  });
  ['show-vertex', 'show-axis', 'show-roots', 'show-yint'].forEach(id => {
    document.getElementById(id).addEventListener('change', drawMainGraph);
  });
  
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const px = (e.clientX - rect.left) * scaleX;
    const py = (e.clientY - rect.top) * scaleY;
    const coords = pixelToMath(px, py, canvas);
    const tooltip = document.getElementById('graph-tooltip');
    tooltip.textContent = `(${coords.x.toFixed(2)}, ${coords.y.toFixed(2)})`;
    tooltip.style.left = (e.clientX - canvas.parentElement.getBoundingClientRect().left + 10) + 'px';
    tooltip.style.top = (e.clientY - canvas.parentElement.getBoundingClientRect().top - 30) + 'px';
    tooltip.classList.remove('hidden');
  });
  
  canvas.addEventListener('mouseleave', () => {
    document.getElementById('graph-tooltip').classList.add('hidden');
  });
  
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomGraph(e.deltaY > 0 ? 0.9 : 1.1);
  });
  
  drawMainGraph();
  updateGraphInfo();
}

function pixelToMath(px, py, canvas) {
  const cx = canvas.width / 2 + graphState.offsetX;
  const cy = canvas.height / 2 + graphState.offsetY;
  const scale = 40 * graphState.zoom;
  return { x: (px - cx) / scale, y: -(py - cy) / scale };
}

function mathToPixel(x, y, canvas) {
  const cx = canvas.width / 2 + graphState.offsetX;
  const cy = canvas.height / 2 + graphState.offsetY;
  const scale = 40 * graphState.zoom;
  return { px: cx + x * scale, py: cy - y * scale };
}

function drawMainGraph() {
  const canvas = document.getElementById('main-graph');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const isDark = document.documentElement.classList.contains('dark');
  
  ctx.fillStyle = isDark ? '#1e293b' : '#ffffff';
  ctx.fillRect(0, 0, w, h);
  
  const cx = w / 2 + graphState.offsetX;
  const cy = h / 2 + graphState.offsetY;
  const scale = 40 * graphState.zoom;
  
  // Grid
  ctx.strokeStyle = isDark ? '#334155' : '#e2e8f0';
  ctx.lineWidth = 1;
  const gridStep = scale;
  for (let x = cx % gridStep; x < w; x += gridStep) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = cy % gridStep; y < h; y += gridStep) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  
  // Axes
  ctx.strokeStyle = isDark ? '#94a3b8' : '#475569';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();
  
  // Axis labels
  ctx.fillStyle = isDark ? '#94a3b8' : '#475569';
  ctx.font = '12px Vazirmatn';
  ctx.textAlign = 'center';
  for (let i = -10; i <= 10; i++) {
    if (i === 0) continue;
    const px = cx + i * scale;
    if (px > 0 && px < w) {
      ctx.fillText(i, px, cy + 15);
    }
    const py = cy - i * scale;
    if (py > 0 && py < h) {
      ctx.textAlign = 'right';
      ctx.fillText(i, cx - 8, py + 4);
      ctx.textAlign = 'center';
    }
  }
  
  const { a, b, c } = graphState;
  if (a === 0) return;
  
  // Parabola
  ctx.strokeStyle = '#6366f1';
  ctx.lineWidth = 3;
  ctx.beginPath();
  let first = true;
  for (let px = 0; px < w; px += 1) {
    const x = (px - cx) / scale;
    const y = a * x * x + b * x + c;
    const py = cy - y * scale;
    if (py < -1000 || py > h + 1000) { first = true; continue; }
    if (first) { ctx.moveTo(px, py); first = false; }
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
  
  const xv = -b / (2 * a);
  const yv = a * xv * xv + b * xv + c;
  const delta = b * b - 4 * a * c;
  
  // Axis of symmetry
  if (document.getElementById('show-axis').checked) {
    const axisPx = cx + xv * scale;
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(axisPx, 0); ctx.lineTo(axisPx, h); ctx.stroke();
    ctx.setLineDash([]);
  }
  
  // Vertex
  if (document.getElementById('show-vertex').checked) {
    const v = mathToPixel(xv, yv, canvas);
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(v.px, v.py, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = isDark ? '#f1f5f9' : '#0f172a';
    ctx.font = 'bold 13px Vazirmatn';
    ctx.fillText(`(${xv.toFixed(2)}, ${yv.toFixed(2)})`, v.px + 12, v.py - 10);
  }
  
  // Roots
  if (document.getElementById('show-roots').checked && delta >= 0) {
    const sqrtD = Math.sqrt(delta);
    const r1 = (-b - sqrtD) / (2 * a);
    const r2 = (-b + sqrtD) / (2 * a);
    ctx.fillStyle = '#10b981';
    [r1, r2].forEach(r => {
      const p = mathToPixel(r, 0, canvas);
      ctx.beginPath(); ctx.arc(p.px, p.py, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = isDark ? '#f1f5f9' : '#0f172a';
      ctx.font = '12px Vazirmatn';
      ctx.fillText(r.toFixed(2), p.px, p.py + 20);
      ctx.fillStyle = '#10b981';
    });
  }
  
  // Y-intercept
  if (document.getElementById('show-yint').checked) {
    const p = mathToPixel(0, c, canvas);
    ctx.fillStyle = '#8b5cf6';
    ctx.beginPath(); ctx.arc(p.px, p.py, 6, 0, Math.PI * 2); ctx.fill();
  }
}

function updateGraphInfo() {
  const { a, b, c } = graphState;
  if (a === 0) {
    document.getElementById('graph-info').innerHTML = '<div class="text-[var(--danger)]">a نمی‌تواند صفر باشد!</div>';
    return;
  }
  const xv = -b / (2 * a);
  const yv = a * xv * xv + b * xv + c;
  const delta = b * b - 4 * a * c;
  let roots = '';
  if (delta > 0) {
    const s = Math.sqrt(delta);
    roots = `x₁ = ${((-b - s) / (2 * a)).toFixed(3)}<br>x₂ = ${((-b + s) / (2 * a)).toFixed(3)}`;
  } else if (delta === 0) {
    roots = `x = ${xv.toFixed(3)} (مضاعف)`;
  } else {
    roots = 'بدون ریشه حقیقی';
  }
  document.getElementById('graph-info').innerHTML = `
    <div class="p-2 bg-[var(--bg)] rounded"><b>معادله:</b> ${a}x² ${b >= 0 ? '+' : ''}${b}x ${c >= 0 ? '+' : ''}${c}</div>
    <div class="p-2 bg-[var(--bg)] rounded"><b>رأس:</b> (${xv.toFixed(2)}, ${yv.toFixed(2)})</div>
    <div class="p-2 bg-[var(--bg)] rounded"><b>محور تقارن:</b> x = ${xv.toFixed(2)}</div>
    <div class="p-2 bg-[var(--bg)] rounded"><b>دلتا:</b> ${delta.toFixed(2)}</div>
    <div class="p-2 bg-[var(--bg)] rounded"><b>ریشه‌ها:</b><br>${roots}</div>
    <div class="p-2 bg-[var(--bg)] rounded"><b>جهت:</b> ${a > 0 ? '∪ رو به بالا' : '∩ رو به پایین'}</div>
    <div class="p-2 bg-[var(--bg)] rounded"><b>${a > 0 ? 'کمینه' : 'بیشینه'}:</b> ${yv.toFixed(2)}</div>
    <div class="p-2 bg-[var(--bg)] rounded"><b>تقاطع با y:</b> (0, ${c})</div>
  `;
}

function zoomGraph(factor, reset) {
  if (reset) { graphState.zoom = 1; graphState.offsetX = 0; graphState.offsetY = 0; }
  else graphState.zoom *= factor;
  graphState.zoom = Math.max(0.2, Math.min(5, graphState.zoom));
  drawMainGraph();
}

function analyzeFunction() {

function buildSignTable(a, b, c, delta) {
  if (delta < 0) {
    return `<div class="p-3 bg-[var(--bg)] rounded-lg">چون $\\Delta < 0$، علامت $f(x)$ همیشه برابر علامت $a$ است (${a > 0 ? 'مثبت' : 'منفی'}).</div>`;
  }
  if (delta === 0) {
    const xv = -b / (2 * a);
    return `<div class="p-3 bg-[var(--bg)] rounded-lg">
      <div>چون $\\Delta = 0$، $f(x)$ همیشه ${a > 0 ? '≥ 0' : '≤ 0'} است و فقط در $x = ${xv.toFixed(2)}$ صفر می‌شود.</div>
    </div>`;
  }
  const s = Math.sqrt(delta);
  const r1 = (-b - s) / (2 * a);
  const r2 = (-b + s) / (2 * a);
  const x1 = Math.min(r1, r2);
  const x2 = Math.max(r1, r2);
  const sign = a > 0 ? '+' : '-';
  const opp = a > 0 ? '-' : '+';
  return `
    <div class="overflow-x-auto">
      <table class="w-full border border-c text-sm">
        <tr class="bg-[var(--bg)]">
          <th class="border border-c p-2">x</th>
          <th class="border border-c p-2">$-\\infty$</th>
          <th class="border border-c p-2">$${x1.toFixed(2)}$</th>
          <th class="border border-c p-2">$${x2.toFixed(2)}$</th>
          <th class="border border-c p-2">$+\\infty$</th>
        </tr>
        <tr>
          <td class="border border-c p-2 font-medium">f(x)</td>
          <td class="border border-c p-2 text-center ${sign === '+' ? 'text-green-600' : 'text-red-600'}">${sign}</td>
          <td class="border border-c p-2 text-center">0</td>
          <td class="border border-c p-2 text-center ${opp === '+' ? 'text-green-600' : 'text-red-600'}">${opp}</td>
          <td class="border border-c p-2 text-center">0</td>
          <td class="border border-c p-2 text-center ${sign === '+' ? 'text-green-600' : 'text-red-600'}">${sign}</td>
        </tr>
      </table>
    </div>
  `;
}

function drawAnalyzerCanvas(a, b, c) {
  const canvas = document.getElementById('analyzer-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const isDark = document.documentElement.classList.contains('dark');
  
  ctx.fillStyle = isDark ? '#1e293b' : '#ffffff';
  ctx.fillRect(0, 0, w, h);
  
  const xv = -b / (2 * a);
  const yv = a * xv * xv + b * xv + c;
  
  // Auto scale
  let xMin = xv - 5, xMax = xv + 5;
  const delta = b * b - 4 * a * c;
  if (delta >= 0) {
    const s = Math.sqrt(delta);
    const r1 = (-b - s) / (2 * a);
    const r2 = (-b + s) / (2 * a);
    xMin = Math.min(r1, r2, xv) - 2;
    xMax = Math.max(r1, r2, xv) + 2;
  }
  
  const yAtMin = a * xMin * xMin + b * xMin + c;
  const yAtMax = a * xMax * xMax + b * xMax + c;
  let yMin = Math.min(yv, yAtMin, yAtMax, 0) - 2;
  let yMax = Math.max(yv, yAtMin, yAtMax, 0) + 2;
  
  const scaleX = w / (xMax - xMin);
  const scaleY = h / (yMax - yMin);
  
  const toPx = (x, y) => ({ px: (x - xMin) * scaleX, py: h - (y - yMin) * scaleY });
  
  // Grid
  ctx.strokeStyle = isDark ? '#334155' : '#e2e8f0';
  ctx.lineWidth = 1;
  for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x++) {
    const px = (x - xMin) * scaleX;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
  }
  for (let y = Math.ceil(yMin); y <= Math.floor(yMax); y++) {
    const py = h - (y - yMin) * scaleY;
    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(w, py); ctx.stroke();
  }
  
  // Axes
  ctx.strokeStyle = isDark ? '#94a3b8' : '#475569';
  ctx.lineWidth = 2;
  const xAxisY = h - (0 - yMin) * scaleY;
  const yAxisX = (0 - xMin) * scaleX;
  if (xAxisY >= 0 && xAxisY <= h) {
    ctx.beginPath(); ctx.moveTo(0, xAxisY); ctx.lineTo(w, xAxisY); ctx.stroke();
  }
  if (yAxisX >= 0 && yAxisX <= w) {
    ctx.beginPath(); ctx.moveTo(yAxisX, 0); ctx.lineTo(yAxisX, h); ctx.stroke();
  }
  
  // Parabola
  ctx.strokeStyle = '#6366f1';
  ctx.lineWidth = 3;
  ctx.beginPath();
  let first = true;
  for (let px = 0; px < w; px++) {
    const x = xMin + (px / scaleX);
    const y = a * x * x + b * x + c;
    const py = h - (y - yMin) * scaleY;
    if (py < -500 || py > h + 500) { first = true; continue; }
    if (first) { ctx.moveTo(px, py); first = false; }
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
  
  // Vertex
  const vp = toPx(xv, yv);
  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.arc(vp.px, vp.py, 6, 0, Math.PI * 2); ctx.fill();
  
  // Roots
  if (delta >= 0) {
    const s = Math.sqrt(delta);
    const r1 = (-b - s) / (2 * a);
    const r2 = (-b + s) / (2 * a);
    ctx.fillStyle = '#10b981';
    [r1, r2].forEach(r => {
      const p = toPx(r, 0);
      ctx.beginPath(); ctx.arc(p.px, p.py, 5, 0, Math.PI * 2); ctx.fill();
    });
  }
}

function solveEquation() {
  const input = document.getElementById('solver-input').value.trim();
  const parsed = parseEquation(input);
  if (!parsed) {
    document.getElementById('solver-result').innerHTML = '<div class="card p-6 text-[var(--danger)]">❌ معادله قابل تشخیص نیست. لطفاً به فرم ax² + bx + c = 0 وارد کنید.</div>';
    return;
  }
  const { a, b, c } = parsed;
  if (a === 0) {
    document.getElementById('solver-result').innerHTML = '<div class="card p-6 text-[var(--danger)]">❌ این معادله درجه دوم نیست (a=0).</div>';
    return;
  }
  
  const xv = -b / (2 * a);
  const yv = a * xv * xv + b * xv + c;
  const delta = b * b - 4 * a * c;
  
  let rootsSection = '';
  if (delta > 0) {
    const s = Math.sqrt(delta);
    const r1 = (-b - s) / (2 * a);
    const r2 = (-b + s) / (2 * a);
    rootsSection = `
      <div class="step-box">
        <div class="font-medium mb-1">گام ۴: محاسبه ریشه‌ها</div>
        <div>$x_{1,2} = \\frac{-b \\pm \\sqrt{\\Delta}}{2a} = \\frac{${-b} \\pm \\sqrt{${delta.toFixed(2)}}}{${2*a}}$</div>
        <div class="mt-2">$x_1 = \\frac{${-b} - ${s.toFixed(3)}}{${2*a}} = ${r1.toFixed(4)}$</div>
        <div>$x_2 = \\frac{${-b} + ${s.toFixed(3)}}{${2*a}} = ${r2.toFixed(4)}$</div>
      </div>
      <div class="mt-3 p-3 bg-[var(--bg)] rounded-lg">
        <b>✅ پاسخ:</b> دو ریشه حقیقی متمایز $x_1 = ${r1.toFixed(4)}$ و $x_2 = ${r2.toFixed(4)}$
      </div>
    `;
  } else if (delta === 0) {
    rootsSection = `
      <div class="step-box">
        <div class="font-medium mb-1">گام ۴: محاسبه ریشه مضاعف</div>
        <div>$x = \\frac{-b}{2a} = \\frac{${-b}}{${2*a}} = ${xv.toFixed(4)}$</div>
      </div>
      <div class="mt-3 p-3 bg-[var(--bg)] rounded-lg">
        <b>✅ پاسخ:</b> یک ریشه حقیقی مضاعف $x = ${xv.toFixed(4)}$
      </div>
    `;
  } else {
    rootsSection = `
      <div class="step-box">
        <div class="font-medium mb-1">گام ۴: نتیجه</div>
        <div>چون $\\Delta < 0$، ریشه حقیقی وجود ندارد.</div>
      </div>
      <div class="mt-3 p-3 bg-[var(--bg)] rounded-lg">
        <b>✅ پاسخ:</b> معادله ریشه حقیقی ندارد.
      </div>
    `;
  }
  
  document.getElementById('solver-result').innerHTML = `
    <div class="card p-6 mb-6">
      <h3 class="font-bold text-lg mb-4">📝 حل مرحله‌به‌مرحله</h3>
      <div class="step-box">
        <div class="font-medium mb-1">گام ۱: تشخیص ضرایب</div>
        <div>$a = ${a}$, $b = ${b}$, $c = ${c}$</div>
      </div>
      <div class="step-box">
        <div class="font-medium mb-1">گام ۲: محاسبه دلتا</div>
        <div>$\\Delta = b^2 - 4ac = (${b})^2 - 4(${a})(${c}) = ${b*b} - ${4*a*c} = ${delta}$</div>
      </div>
      <div class="step-box">
        <div class="font-medium mb-1">گام ۳: تحلیل دلتا</div>
        <div>${delta > 0 ? '$\\Delta > 0$ → دو ریشه حقیقی متمایز' : delta === 0 ? '$\\Delta = 0$ → یک ریشه مضاعف' : '$\\Delta < 0$ → بدون ریشه حقیقی'}</div>
      </div>
      ${rootsSection}
    </div>
    <div class="card p-6">
      <h3 class="font-bold text-lg mb-4">📈 نمودار</h3>
      <canvas id="solver-canvas" width="600" height="400" class="w-full rounded-xl border border-c"></canvas>
    </div>
  `;
  
  drawAnalyzerCanvas(a, b, c);
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}

function parseEquation(input) {
  let s = input.replace(/\s/g, '').replace(/=.*$/, '');
  s = s.replace(/\^2/g, '²').replace(/x²/g, 'x²').replace(/X²/g, 'x²');
  // Try to extract coefficients
  // Format: ax² + bx + c
  const regex = /^([+-]?\d*\.?\d*)x²([+-]\d*\.?\d*)x([+-]\d+\.?\d*)$/;
  const m = s.match(regex);
  if (m) {
    const a = m[1] === '' || m[1] === '+' ? 1 : m[1] === '-' ? -1 : parseFloat(m[1]);
    const b = m[2] === '+' || m[2] === '' ? 1 : m[2] === '-' ? -1 : parseFloat(m[2]);
    const c = parseFloat(m[3]);
    return { a, b, c };
  }
  // Try alternative: ax^2+bx+c
  const s2 = input.replace(/\s/g, '').replace(/=.*$/, '').replace(/\^2/g, '²');
  const m2 = s2.match(/^([+-]?\d*\.?\d*)x²([+-]\d*\.?\d*)x([+-]\d+\.?\d*)$/);
  if (m2) {
    const a = m2[1] === '' || m2[1] === '+' ? 1 : m2[1] === '-' ? -1 : parseFloat(m2[1]);
    const b = m2[2] === '+' || m2[2] === '' ? 1 : m2[2] === '-' ? -1 : parseFloat(m2[2]);
    const c = parseFloat(m2[3]);
    return { a, b, c };
  }
  return null;
}

function selectQuizOption(qid, idx) {
  const q = quizBank.find(x => x.id === qid);
  const options = document.querySelectorAll('#quiz-options .option-btn');
  options.forEach(o => o.classList.remove('selected', 'correct', 'wrong'));
  options[idx].classList.add('selected');
  
  const correct = idx === q.answer;
  options[q.answer].classList.add('correct');
  if (!correct) options[idx].classList.add('wrong');
  
  // Update stats
  state.stats.solved++;
  if (correct) state.stats.correct++;
  else {
    state.stats.wrong++;
    if (!state.stats.weakTopics.includes(q.topic)) state.stats.weakTopics.push(q.topic);
  }
  state.stats.lastActivity = Date.now();
  saveState();
  
  document.getElementById('quiz-feedback').innerHTML = `
    <div class="card p-6 mb-4 ${correct ? 'border-r-4 border-[var(--accent)]' : 'border-r-4 border-[var(--danger)]'}">
      <div class="font-bold text-lg mb-2">${correct ? '✅ آفرین! پاسخ صحیح' : '❌ پاسخ نادرست'}</div>

}

function startExam() {
  const count = parseInt(document.getElementById('exam-count').value);
  const topics = Array.from(document.querySelectorAll('.exam-topic:checked')).map(c => c.value);
  const level = document.getElementById('exam-level').value;
  
  let pool = quizBank.filter(q => topics.includes(q.topic));
  if (level) pool = pool.filter(q => q.level === level);
  
  if (pool.length === 0) {
    alert('سؤالی با این تنظیمات یافت نشد!');
    return;
  }
  
  // Shuffle and pick
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(count, shuffled.length));
  
  state.examState = {
    questions: selected,
    current: 0,
    answers: {},
    marked: {},
    startTime: Date.now(),
    timePerQ: {},
    mode: 'exam',
    lastQStart: Date.now()
  };
  renderExamQuestion();
}

            </div>
          `).join('')}
        </div>
      </div>
      <div class="flex items-center justify-between mb-4">
        <button onclick="prevExamQ()" class="btn-ghost px-4 py-2 rounded-xl text-sm" ${es.current === 0 ? 'disabled style="opacity:0.5"' : ''}>← قبلی</button>
        <button onclick="toggleMark()" class="btn-ghost px-4 py-2 rounded-xl text-sm">${es.marked[es.current] ? '⭐ علامت‌دار' : '☆ علامت‌گذاری'}</button>
        ${es.current < es.questions.length - 1 ? 
          `<button onclick="nextExamQ()" class="btn-primary px-4 py-2 rounded-xl text-sm">بعدی →</button>` :
          `<button onclick="finishExam()" class="btn-primary px-4 py-2 rounded-xl text-sm">پایان آزمون</button>`}
      </div>

        <div class="text-sm font-medium mb-2">نمای سؤالات:</div>
        <div class="flex flex-wrap gap-2">
          ${es.questions.map((_, i) => {
            let cls = 'bg-[var(--border)]';
            if (es.answers[i] !== undefined) cls = 'bg-[var(--primary)] text-white';
            if (es.marked[i]) cls += ' ring-2 ring-[var(--warning)]';
            if (i === es.current) cls += ' ring-2 ring-[var(--accent)]';
            return `<button onclick="goToExamQ(${i})" class="w-8 h-8 rounded-lg ${cls} text-sm">${i + 1}</button>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
  
  // Timer update
  if (window.examTimer) clearInterval(window.examTimer);
  window.examTimer = setInterval(() => {
    const el = document.getElementById('exam-timer');
    if (el) {
      const e = Math.floor((Date.now() - state.examState.startTime) / 1000);
      el.textContent = formatTime(e);
    }
  }, 1000);
}

function selectExamOption(i) {
  state.examState.answers[state.examState.current] = i;
  renderExamQuestion();
}

function nextExamQ() {
  if (state.examState.current < state.examState.questions.length - 1) {
    state.examState.current++;
    renderExamQuestion();
  }
}

function prevExamQ() {
  if (state.examState.current > 0) {
    state.examState.current--;
    renderExamQuestion();
  }
}

function goToExamQ(i) {
  state.examState.current = i;
  renderExamQuestion();
}

function toggleMark() {
  state.examState.marked[state.examState.current] = !state.examState.marked[state.examState.current];
  renderExamQuestion();
}

function finishExam() {
  if (window.examTimer) clearInterval(window.examTimer);
  const es = state.examState;
  const totalTime = Math.floor((Date.now() - es.startTime) / 1000);
  
  let correct = 0, wrong = 0, unanswered = 0;
  const topicStats = {};
  
  es.questions.forEach((q, i) => {
    if (!topicStats[q.topic]) topicStats[q.topic] = { correct: 0, total: 0 };
    topicStats[q.topic].total++;
    
    if (es.answers[i] === undefined) unanswered++;
    else if (es.answers[i] === q.answer) { correct++; topicStats[q.topic].correct++; }
    else wrong++;
  });
  
  state.stats.solved += es.questions.length;
  state.stats.correct += correct;
  state.stats.wrong += wrong;
  state.stats.lastActivity = Date.now();
  
  // Update weak topics
  Object.keys(topicStats).forEach(t => {
    const s = topicStats[t];
    if (s.correct / s.total < 0.5 && !state.stats.weakTopics.includes(t)) {
      state.stats.weakTopics.push(t);
    }
  });
  
  saveState();
  
  state.examState.mode = 'result';
  state.examState.result = { correct, wrong, unanswered, totalTime, topicStats };
  renderExamResult();
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

            const done = state.completedChapters.includes(c.id);
            const score = state.chapterScores[c.id];
            return `
              <div class="flex items-center gap-3 p-3 bg-[var(--bg)] rounded-lg">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm ${done ? 'bg-[var(--accent)] text-white' : 'bg-[var(--border)]'}">
                  ${done ? '✓' : c.id}
                </div>
                <div class="flex-1">
                  <div class="font-medium">${c.title}</div>
                  ${score !== undefined ? `
                    <div class="progress-bar h-1.5 mt-1"><div class="progress-fill h-full" style="width:${score}%"></div></div>
                  ` : ''}
                </div>
                <div class="text-sm muted">${done ? 'تکمیل شد' : 'نخوانده'}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
      
      ${state.stats.weakTopics.length > 0 ? `
        <div class="card p-6 mb-6" style="border-right: 4px solid var(--warning);">
          <h3 class="font-bold text-lg mb-3">⚠️ نقاط ضعف</h3>
          <div class="flex flex-wrap gap-2">
            ${state.stats.weakTopics.map(t => `<span class="badge bg-[var(--warning)] bg-opacity-20 text-[var(--warning)]">${t}</span>`).join('')}
          </div>
        </div>
      ` : ''}
      
      <div class="card p-6">
        <h3 class="font-bold text-lg mb-3">🔄 بازنشانی</h3>
        <p class="text-sm muted mb-3">می‌توانید تمام پیشرفت خود را پاک کنید و از نو شروع کنید.</p>
        <button onclick="resetProgress()" class="btn-ghost px-4 py-2 rounded-xl text-sm text-[var(--danger)]">پاک کردن تمام داده‌ها</button>
      </div>
    </div>
  `;
}

function resetProgress() {
  if (confirm('آیا مطمئن هستید؟ تمام پیشرفت شما پاک خواهد شد.')) {
    localStorage.clear();
    state.progress = {};
    state.stats = { solved: 0, correct: 0, wrong: 0, lastActivity: null, weakTopics: [] };
    state.completedChapters = [];
    state.chapterScores = {};
    navigate('dashboard');
  }
}

/* =========================================================
   INTERACTIVE CANVASES (Chapter 2 & 6)
   ========================================================= */
function initParabolaCanvas() {
  const canvas = document.getElementById('parabola-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  const draw = () => {
    const a = parseFloat(document.getElementById('slider-a').value);
    const h = parseFloat(document.getElementById('slider-h').value);
    const k = parseFloat(document.getElementById('slider-k').value);
    
    document.getElementById('a-val').textContent = a;
    document.getElementById('h-val').textContent = h;
    document.getElementById('k-val').textContent = k;
    
    const w = canvas.width, hh = canvas.height;
    const isDark = document.documentElement.classList.contains('dark');
    ctx.fillStyle = isDark ? '#1e293b' : '#ffffff';
    ctx.fillRect(0, 0, w, hh);
    
    const cx = w / 2, cy = hh / 2;
    const scale = 30;
    
    // Grid
    ctx.strokeStyle = isDark ? '#334155' : '#e2e8f0';
    ctx.lineWidth = 1;
    for (let x = cx % scale; x < w; x += scale) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, hh); ctx.stroke();
    }
    for (let y = cy % scale; y < hh; y += scale) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    
    // Axes
    ctx.strokeStyle = isDark ? '#94a3b8' : '#475569';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, hh); ctx.stroke();
    
    if (a === 0) return;
    
    // Parabola y = a(x-h)² + k
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 3;
    ctx.beginPath();
    let first = true;
    for (let px = 0; px < w; px++) {
      const x = (px - cx) / scale;
      const y = a * Math.pow(x - h, 2) + k;
      const py = cy - y * scale;
      if (py < -500 || py > hh + 500) { first = true; continue; }
      if (first) { ctx.moveTo(px, py); first = false; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    
    // Vertex
    const vx = cx + h * scale;
    const vy = cy - k * scale;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(vx, vy, 6, 0, Math.PI * 2); ctx.fill();
    
    // Equation display
    const hSign = h >= 0 ? '-' : '+';
    const kSign = k >= 0 ? '+' : '-';
    const eq = `$y = ${a}(x ${hSign} ${Math.abs(h).toFixed(1)})^2 ${kSign} ${Math.abs(k).toFixed(1)}$`;
    document.getElementById('current-eq').innerHTML = eq;
    document.getElementById('current-vertex').innerHTML = `(${h.toFixed(1)}, ${k.toFixed(1)})`;
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([document.getElementById('current-eq')]);
  };
  
  ['slider-a', 'slider-h', 'slider-k'].forEach(id => {
    document.getElementById(id).addEventListener('input', draw);
  });
  draw();
}

function initDeltaCanvas() {
  const canvas = document.getElementById('delta-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  const draw = () => {
    const a = parseFloat(document.getElementById('slider-da').value);
    const b = parseFloat(document.getElementById('slider-db').value);
    const c = parseFloat(document.getElementById('slider-dc').value);
    
    document.getElementById('da-val').textContent = a;
    document.getElementById('db-val').textContent = b;
    document.getElementById('dc-val').textContent = c;
    
    const delta = b * b - 4 * a * c;
    const dv = document.getElementById('delta-value');
    const ds = document.getElementById('delta-status');
    dv.textContent = `Δ = ${delta.toFixed(2)}`;
    dv.style.color = delta > 0 ? 'var(--accent)' : delta === 0 ? 'var(--warning)' : 'var(--danger)';
    ds.textContent = delta > 0 ? '✅ دو ریشه متمایز' : delta === 0 ? '⚠️ ریشه مضاعف' : '❌ بدون ریشه حقیقی';
    
    const w = canvas.width, h = canvas.height;
    const isDark = document.documentElement.classList.contains('dark');
    ctx.fillStyle = isDark ? '#1e293b' : '#ffffff';
    ctx.fillRect(0, 0, w, h);
    
    const cx = w / 2, cy = h / 2;
    const scale = 30;
    
    ctx.strokeStyle = isDark ? '#334155' : '#e2e8f0';
    ctx.lineWidth = 1;
    for (let x = cx % scale; x < w; x += scale) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = cy % scale; y < h; y += scale) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    
    ctx.strokeStyle = isDark ? '#94a3b8' : '#475569';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();
    
    if (a === 0) return;
    
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 3;
    ctx.beginPath();
    let first = true;
    for (let px = 0; px < w; px++) {
      const x = (px - cx) / scale;
      const y = a * x * x + b * x + c;
      const py = cy - y * scale;
      if (py < -500 || py > h + 500) { first = true; continue; }
      if (first) { ctx.moveTo(px, py); first = false; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    
    // Roots
    if (delta >= 0) {
      const s = Math.sqrt(delta);
      const r1 = (-b - s) / (2 * a);
      const r2 = (-b + s) / (2 * a);
      ctx.fillStyle = '#10b981';
      [r1, r2].forEach(r => {
        const px = cx + r * scale;
        ctx.beginPath(); ctx.arc(px, cy, 6, 0, Math.PI * 2); ctx.fill();
      });
    }
  };
  
  ['slider-da', 'slider-db', 'slider-dc'].forEach(id => {
    document.getElementById(id).addEventListener('input', draw);
  });
  draw();
}

/* =========================================================
   SEARCH
   ========================================================= */
function initSearch() {
  const input = document.getElementById('search-input');
  const results = document.getElementById('search-results');
  
  const searchItems = [
    ...chapters.map(c => ({ type: 'chapter', title: c.title, id: c.id, icon: c.icon })),
    ...formulas.map(f => ({ type: 'formula', title: f.cat + ': ' + f.f, icon: '📋' })),
    ...flashcards.map(f => ({ type: 'flash', title: f.q, icon: '🎴' })),
    { type: 'page', title: 'نمودار تعاملی', page: 'graph', icon: '📈' },
    { type: 'page', title: 'ماشین تحلیل', page: 'analyzer', icon: '🔬' },
    { type: 'page', title: 'حل‌کننده', page: 'solver', icon: '🧮' },
    { type: 'page', title: 'بانک تست', page: 'quiz', icon: '📝' },
    { type: 'page', title: 'آزمون', page: 'exam', icon: '🎯' },
    { type: 'page', title: 'فرمول‌نامه', page: 'formulas', icon: '📋' },
    { type: 'page', title: 'فلش‌کارت', page: 'flashcards', icon: '🎴' },
    { type: 'page', title: 'اشتباهات رایج', page: 'mistakes', icon: '⚠️' },
    { type: 'page', title: 'پیشرفت', page: 'progress', icon: '📊' }
  ];
  
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { results.classList.add('hidden'); return; }
    const matches = searchItems.filter(item => item.title.toLowerCase().includes(q)).slice(0, 8);
    if (matches.length === 0) {
      results.innerHTML = '<div class="p-3 text-sm muted">نتیجه‌ای یافت نشد</div>';
    } else {
      results.innerHTML = matches.map(m => `
        <div class="p-3 hover:bg-[var(--bg)] cursor-pointer text-sm flex items-center gap-2" onclick="handleSearchClick('${m.type}', ${m.id || 0}, '${m.page || ''}')">
          <span>${m.icon}</span>
          <span>${m.title}</span>
        </div>
      `).join('');
    }
    results.classList.remove('hidden');
  });
  
  input.addEventListener('blur', () => setTimeout(() => results.classList.add('hidden'), 200));
}

function handleSearchClick(type, id, page) {
  document.getElementById('search-results').classList.add('hidden');
  document.getElementById('search-input').value = '';
  if (type === 'chapter') navigate('chapter', id);
  else if (type === 'page') navigate(page);
  else if (type === 'formula') navigate('formulas');
  else if (type === 'flash') navigate('flashcards');
}

/* =========================================================
   THEME
   ========================================================= */
function initTheme() {
  if (state.darkMode) {
    document.documentElement.classList.add('dark');
    document.getElementById('icon-sun').classList.add('hidden');
    document.getElementById('icon-moon').classList.remove('hidden');
  }
  document.getElementById('theme-toggle').addEventListener('click', () => {
    state.darkMode = !state.darkMode;
    document.documentElement.classList.toggle('dark');
    document.getElementById('icon-sun').classList.toggle('hidden');
    document.getElementById('icon-moon').classList.toggle('hidden');
    saveState();
    // Redraw canvases
    if (state.currentPage === 'graph') drawMainGraph();
  });
}
